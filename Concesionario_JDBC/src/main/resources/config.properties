# ==========================================================
#  Configuracion de la aplicacion Concesionario (JDBC)
#  Ningun dato de conexion debe estar escrito en el codigo.
# ==========================================================

# ---------- MySQL (BBDD de servidor) ----------
mysql.driver=com.mysql.cj.jdbc.Driver
# URL al servidor SIN base de datos: el schema se crea desde Java
mysql.url=jdbc:mysql://localhost:3306/
mysql.database=concesionario
mysql.user=root
mysql.password=root

# ---------- SQLite (BBDD embebida) ----------
sqlite.driver=org.sqlite.JDBC
# El fichero .db se crea automaticamente si no existe
sqlite.url=jdbc:sqlite:concesionario.db

# ---------- Rutas de ficheros ----------
# El CSV esta en src/main/resources, se lee desde el classpath igual que este fichero
csv.ruta=coches.csv
# El informe se genera en la carpeta desde la que se ejecuta el programa
informe.ruta=informe_concesionario.txt
